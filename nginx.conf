server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

  location = / {
    try_files /index.html =404;
  }

  location /api/convert/ {
    proxy_pass http://converter-api:3001/api/convert/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Internal-Proxy-Token "${CONVERTER_INTERNAL_PROXY_TOKEN}";
    proxy_request_buffering off;
    proxy_read_timeout ${NGINX_PROXY_READ_TIMEOUT};
    proxy_buffering off;
  }

  # Block Next.js RSC payload (.txt) files from being served directly.
  # On static export, Next.js <Link> tries to fetch page.txt for client-side
  # navigation. When served from plain Nginx (no Next.js server), this breaks
  # and shows raw RSC payload. Returning 404 forces a clean full-page navigation.
  location ~ \.txt$ {
    return 404;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
